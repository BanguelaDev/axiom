name: APK Android local
on:
  workflow_dispatch:
  push:
    branches: [feat/build-android-local]
permissions:
  contents: write
concurrency:
  group: android-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_LOCAL_SERVER: 'true'
      EXPO_PUBLIC_LOCAL_API_URL: ''
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      CANDIDATE_TAG: android-local-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Reservar rascunho antes de compilar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$CANDIDATE_TAG" || gh release create "$CANDIDATE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "AXIOM Android local — candidato" --notes-file docs/android-apk.md
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Gerar projeto nativo com os plugins do Expo
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - run: node scripts/verify-android-config.mjs
      - name: Compilar APK para teste interno
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Conferir assinatura e preparar arquivos
        run: |
          mkdir -p work/android-release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk work/android-release/AXIOM-android-local.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose work/android-release/AXIOM-android-local.apk
          cd work/android-release
          sha256sum AXIOM-android-local.apk > SHA256SUMS.txt
          git rev-parse HEAD > source-commit.txt
      - name: Guardar candidato como rascunho de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$CANDIDATE_TAG" work/android-release/* --clobber

