appId: br.com.axiom.mobile
---
- launchApp:
    clearState: true
- assertVisible: "Conecte ao seu computador."
- tapOn:
    id: server-url-input
- inputText: http://10.0.2.2:8787
- hideKeyboard
- tapOn:
    text: "Conectar"
    containsChild:
      text: "Conectar"
- assertVisible: "(?s)O mundo, em.*"
- launchApp
- assertVisible: "(?s)O mundo, em.*"
- scrollUntilVisible:
    element: "Explorar Inteligência Artificial"
- tapOn: "Explorar Inteligência Artificial"
- scrollUntilVisible:
    element: "Gerar podcast de dois minutos"
- tapOn:
    text: "Gerar podcast de dois minutos"
    containsChild:
      text: "Gerar podcast de dois minutos"
- extendedWaitUntil:
    visible: "Abrir podcast"
    timeout: 30000
- tapOn:
    text: "Abrir podcast"
    containsChild:
      text: "Abrir podcast"
- scrollUntilVisible:
    element: "Ouvir podcast"
- tapOn:
    text: "Ouvir podcast"
    containsChild:
      text: "Ouvir podcast"
- assertVisible: "Pausar podcast"
- scrollUntilVisible:
    element: "Avançar 15 s"
- tapOn:
    text: "Avançar 15 s"
    containsChild:
      text: "Avançar 15 s"
- tapOn:
    text: "Pausar podcast"
    containsChild:
      text: "Pausar podcast"
- assertVisible: "Continuar podcast"
- tapOn:
    text: "Continuar podcast"
    containsChild:
      text: "Continuar podcast"
- assertVisible: "Pausar podcast"
- takeScreenshot: work/native-evidence/player
- pressKey: home
